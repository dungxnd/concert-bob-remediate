name: 'Run Bob Shell'
author: 'IBM'
description: |-
  Invoke Bob Shell from a GitHub Action.

inputs:
  bobshell_api_key:
    description: 'The API key used for authenticating with Bob Shell.'
    required: true
  bobshell_debug:
    description: 'Enable debug logging and output streaming.'
    required: false
    default: false
  prompt:
    description: 'A string passed to Bob Shell `--prompt` argument.'
    required: false
    default: 'You are a helpful assistant.'
  chat_mode:
    description: 'The mode slug to use (e.g., "devops-concert", "vuln-remediation-concert"). Passed to `bob run --mode`.'
    required: false
  team_id:
    description: 'Optional team ID passed to `bob run --team-id`. Required when the API key type is "general".'
    required: false
  settings:
    description: 'A JSON string written to `.bob/settings.json` to configure Bob Shell project settings.'
    required: false
  mcp:
    description: 'A JSON string written to `.bob/mcp.json` to configure Bob Shell MCP settings.'
    required: false
outputs:
  summary:
    description: 'The summarized output from the Bob Shell execution.'
    value: '${{ steps.bobshell_run.outputs.bobshell_response }}'
  error:
    description: 'The error output from the Bob Shell execution, if any.'
    value: '${{ steps.bobshell_run.outputs.bobshell_errors }}'
  pr_number:
    description: 'The created pull request number, if Bob Shell emitted one.'
    value: '${{ steps.bobshell_run.outputs.pr_number }}'
  pr_branch:
    description: 'The created pull request branch, if Bob Shell emitted one.'
    value: '${{ steps.bobshell_run.outputs.pr_branch }}'
  pr_url:
    description: 'The created pull request URL, if Bob Shell emitted one.'
    value: '${{ steps.bobshell_run.outputs.pr_url }}'

runs:
  using: 'composite'
  steps:
    - name: 'Validate Inputs'
      id: 'validate_inputs'
      shell: 'bash'
      run: |-
        set -exuo pipefail

        # Validate Bob API key
        if [[ "${INPUT_BOBSHELL_API_KEY_PRESENT:-false}" == "false" ]]; then
          echo "ERROR: Authentication key not provided. Please provide 'bobshell_api_key'." >&2
          echo "::error title=Input validation::Authentication key not provided. Please provide 'bobshell_api_key'."
          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            {
              echo "### Input validation errors"
              echo
              echo "- Authentication key not provided. Please provide 'bobshell_api_key'."
            } >> "${GITHUB_STEP_SUMMARY}"
          fi
          exit 1
        fi
      env:
        INPUT_BOBSHELL_API_KEY_PRESENT: "${{ inputs.bobshell_api_key != '' }}"

    - name: 'Configure Bob Shell'
      run: |-
        if [[ "${SETTINGS:-}" || "${MCP:-}" ]]; then
          mkdir -p .bob/
          if [[ "${SETTINGS:-}" ]]; then
            echo "Configuring Bob Shell project settings."
            echo "${SETTINGS}" > ".bob/settings.json"
          fi
          if [[ "${MCP:-}" ]]; then
            echo "Configuring Bob Shell MCP settings."
            echo "${MCP}" > ".bob/mcp.json"
          fi
        else
          echo "Nothing to configure."
        fi
      shell: 'bash'
      env:
        SETTINGS: '${{ inputs.settings }}'
        MCP: '${{ inputs.mcp }}'

    - name: 'Install Bob Shell'
      id: 'install'
      shell: 'bash'
      run: |-
        set -euo pipefail

        echo "Installing the latest version of Bob Shell."
        curl -s https://s3.us-south.cloud-object-storage.appdomain.cloud/bobshell/install-bobshell.sh | bash -s -- --pm npm

        echo "Verifying installation:"
        if command -v bob >/dev/null 2>&1; then
          bob --version || echo "Bob Shell installed successfully (version command not available)"
        else
          echo "Error: Bob Shell not found in PATH"
          exit 1
        fi

    - name: 'Run Bob Shell'
      id: 'bobshell_run'
      shell: 'bash'
      run: |-
        set -euo pipefail

        # Create a temporary directory for storing the output, and ensure it's
        # cleaned up later
        TEMP_STDOUT="$(mktemp -p "${RUNNER_TEMP}" bobshell-out.XXXXXXXXXX)"
        TEMP_STDERR="$(mktemp -p "${RUNNER_TEMP}" bobshell-err.XXXXXXXXXX)"
        function cleanup {
          rm -f "${TEMP_STDOUT}" "${TEMP_STDERR}"
        }
        trap cleanup EXIT

        # Keep track of whether we've failed
        FAILED=false

        # Build the Bob Shell 2.x non-interactive command (`bob run`).
        # Authentication uses the BOB_API_KEY environment variable; all tools
        # are pre-approved in `bob run`, so no --yolo/--auth-method flags.
        BOB_ARGS=(run --accept-license)
        if [[ -n "${CHAT_MODE:-}" ]]; then
          BOB_ARGS+=(--mode "${CHAT_MODE}")
          echo "Using mode: ${CHAT_MODE}"
        fi
        if [[ -n "${TEAM_ID:-}" ]]; then
          BOB_ARGS+=(--team-id "${TEAM_ID}")
        fi

        # The prompt is piped via stdin to avoid shell quoting problems with
        # large multi-line prompts.
        # Run Bob Shell with the provided prompt, streaming responses in debug
        if [[ "${DEBUG}" = true ]]; then
          echo "::warning::Bob Shell debug logging is enabled. This will stream responses, which could reveal sensitive information if processed with untrusted inputs."
          if ! { printf '%s' "${PROMPT}" | bob "${BOB_ARGS[@]}" 2> >(tee "${TEMP_STDERR}" >&2) | tee "${TEMP_STDOUT}"; }; then
            FAILED=true
          fi
        else
          if ! printf '%s' "${PROMPT}" | bob "${BOB_ARGS[@]}" 2> "${TEMP_STDERR}" 1> "${TEMP_STDOUT}"; then
            FAILED=true
          fi
        fi

        BOBSHELL_RESPONSE="$(cat "${TEMP_STDOUT}")"

        # Sanitize response to prevent GitHub Actions file command interpretation
        # Remove lines that could be misinterpreted as GitHub Actions file commands:
        # - Lines with [current working directory ...]
        # - Lines starting with --- (like ---output---)
        # - Lines that look like file command patterns
        SANITIZED_RESPONSE="$(echo "${BOBSHELL_RESPONSE}" | \
          grep -v '\[current working directory' | \
          grep -v '^---' | \
          grep -v '^\[' || true)"
        
        # Set the captured response as a step output, supporting multiline
        echo "bobshell_response<<EOF" >> "${GITHUB_OUTPUT}"
        echo "${SANITIZED_RESPONSE}" >> "${GITHUB_OUTPUT}"
        echo "EOF" >> "${GITHUB_OUTPUT}"

        BOBSHELL_ERRORS="$(cat "${TEMP_STDERR}")"

        # Set the captured errors as a step output, supporting multiline
        echo "bobshell_errors<<EOF" >> "${GITHUB_OUTPUT}"
        echo "${BOBSHELL_ERRORS}" >> "${GITHUB_OUTPUT}"
        echo "EOF" >> "${GITHUB_OUTPUT}"

        # Extract PR metadata from the original response (not sanitized)
        PR_NUMBER="$(printf '%s\n' "${BOBSHELL_RESPONSE}" | sed -n 's/^PR_NUMBER:[[:space:]]*//p' | head -1)"
        PR_BRANCH="$(printf '%s\n' "${BOBSHELL_RESPONSE}" | sed -n 's/^PR_BRANCH:[[:space:]]*//p' | head -1)"
        PR_URL="$(printf '%s\n' "${BOBSHELL_RESPONSE}" | sed -n 's/^PR_URL:[[:space:]]*//p' | head -1)"

        echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
        echo "pr_branch=${PR_BRANCH}" >> "${GITHUB_OUTPUT}"
        echo "pr_url=${PR_URL}" >> "${GITHUB_OUTPUT}"

        if [[ -n "${PR_NUMBER}" ]]; then
          echo "Extracted structured PR number: ${PR_NUMBER}"
        fi
        if [[ -n "${PR_BRANCH}" ]]; then
          echo "Extracted structured PR branch: ${PR_BRANCH}"
        fi
        if [[ -n "${PR_URL}" ]]; then
          echo "Extracted structured PR url: ${PR_URL}"
        fi

        if [[ "${FAILED}" = true ]]; then
          LAST_LINE="$(echo "${BOBSHELL_ERRORS}" | tail -n1)"
          echo "::error title=Bob Shell execution failed::${LAST_LINE}"
          echo "See logs for more details"
          exit 1
        fi
      env:
        DEBUG: '${{ fromJSON(inputs.bobshell_debug || false) }}'
        BOB_API_KEY: '${{ inputs.bobshell_api_key }}'
        BOBSHELL_API_KEY: '${{ inputs.bobshell_api_key }}'
        TEAM_ID: '${{ inputs.team_id }}'
        PROMPT: '${{ inputs.prompt }}'
        CHAT_MODE: '${{ inputs.chat_mode }}'
        SETTINGS: '${{ inputs.settings }}'
        GH_TOKEN: '${{ github.token }}'

branding:
  icon: 'terminal'
  color: 'blue'
