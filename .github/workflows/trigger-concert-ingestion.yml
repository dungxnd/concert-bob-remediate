name: Trigger Concert Ingestion Job

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  trigger-ingestion:
    runs-on: ubuntu-latest
    
    steps:
      - name: Trigger Concert Ingestion API
        env:
          CONCERT_API_KEY: ${{ secrets.CONCERT_API_KEY }}
          INSTANCE_ID: ${{ secrets.CONCERT_INSTANCE_ID || vars.CONCERT_INSTANCE_ID || '0000-0000-0000-0000' }}
          CONCERT_URL: ${{ vars.CONCERT_HOSTNAME || secrets.CONCERT_HOSTNAME || 'https://162.133.134.251:12443' }}
          # API path prefix, same as upload-sbom-to-concert.yml ("none" for no prefix).
          API_PREFIX: ${{ vars.CONCERT_API_PREFIX || '/concert' }}
          # This job previously always used curl -k, so TLS verification stays
          # off unless CONCERT_INSECURE_TLS is set to "false".
          INSECURE_TLS: ${{ vars.CONCERT_INSECURE_TLS || 'true' }}
          JOB_ID: ${{ vars.INGESTION_JOB_ID || 'b1818e95-0749-4b6c-b463-3155139ed992' }}
        run: |
          echo "Triggering Concert ingestion job..."
          echo "Job ID: ${JOB_ID}"

          [ "${API_PREFIX}" = "none" ] && API_PREFIX=""
          SUBMIT_URL="${CONCERT_URL%/}${API_PREFIX}/ingestion/api/v1/job/v2/submit"

          CURL_TLS=()
          if [ "${INSECURE_TLS}" = "true" ]; then
            CURL_TLS=(-k)
          fi

          RESPONSE=$(curl "${CURL_TLS[@]}" --request POST \
            --url "${SUBMIT_URL}" \
            --header "Authorization: ${CONCERT_API_KEY}" \
            --header "InstanceId: ${INSTANCE_ID}" \
            --header 'accept: application/json' \
            --header 'content-type: application/json' \
            --data "{\"job_details\":{\"job_id\":\"${JOB_ID}\",\"job_type\":\"source_control_discovery_job\"}}" \
            --write-out "\nHTTP_STATUS:%{http_code}" \
            --silent)
          
          HTTP_STATUS=$(echo "$RESPONSE" | grep "HTTP_STATUS:" | cut -d':' -f2)
          BODY=$(echo "$RESPONSE" | sed '/HTTP_STATUS:/d')
          
          echo "Response Status: $HTTP_STATUS"
          echo "Response Body: $BODY"
          
          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Concert ingestion job submitted successfully"
            echo "Job ID: ${JOB_ID}"
          else
            echo "❌ Failed to submit Concert ingestion job"
            echo "Status Code: $HTTP_STATUS"
            echo "Response: $BODY"
            exit 1
          fi
      
      - name: Job Summary
        if: always()
        run: |
          echo "## Concert Ingestion Job Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Job ID**: ${{ vars.INGESTION_JOB_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Job Type**: source_control_discovery_job" >> $GITHUB_STEP_SUMMARY
          echo "- **Triggered By**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

