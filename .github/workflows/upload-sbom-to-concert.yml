name: Upload credit-app SBOM to Concert

# Generates a CycloneDX package SBOM, a ConcertDef application SBOM and a Trivy
# vulnerability scan for app/credit-app and uploads them to IBM Concert 3.x
# through the ingestion API:
#   POST {CONCERT_HOSTNAME}{API_PREFIX}/ingestion/api/v1/upload_files
# API_PREFIX defaults to /concert (see the upload step).
# Docs: https://www.ibm.com/docs/en/SSQNYH_3.1.x/doc/ingesting_data_via_api.html

on:
  push:
    branches:
      - main
    paths:
      - 'app/credit-app/pom.xml'
      - 'app/credit-app/src/**'
      - '.github/workflows/upload-sbom-to-concert.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: concert-sbom-${{ github.ref }}
  cancel-in-progress: true

env:
  APP_DIR: app/credit-app
  APP_NAME: credit-app
  # Pinned: the plugin is invoked by full coordinates, so pom.xml is not modified.
  CYCLONEDX_MAVEN_PLUGIN: org.cyclonedx:cyclonedx-maven-plugin:2.9.3

jobs:
  upload-sbom:
    name: Generate and upload SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'
          cache: maven

      - name: Generate CycloneDX package SBOM
        working-directory: ${{ env.APP_DIR }}
        run: |
          # Concert supports CycloneDX 1.6 or older. For source code repositories it
          # only accepts a root component of type "application" or "file"; the
          # plugin default is "library", which Concert rejects.
          mvn -B -ntp "${CYCLONEDX_MAVEN_PLUGIN}:makeBom" \
            -DschemaVersion=1.6 \
            -DprojectType=application \
            -DoutputFormat=json \
            -DoutputName=bom \
            -DincludeTestScope=false
          test -s target/bom.json

          # Concert registers a repository URL under one name only (here the GitHub
          # repository name). The plugin names the root component after the Maven
          # artifactId (credit-app), so rename it to match the registered name.
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          # Concert requires a serialNumber + version combination that it has not
          # seen before. The plugin derives serialNumber from the project coordinates,
          # so it is identical on every run and Concert rejects the second upload
          # ("serial number ... version '1' already exists"). Use a fresh serial per run.
          # Concert also rejects an SBOM whose metadata.timestamp is not newer than the
          # one it already holds for the entity ("a newer SBOM already exists"), so the
          # timestamp is set explicitly to the current UTC time on every run.
          jq --arg n "${REPO_NAME}" --arg u "urn:uuid:$(cat /proc/sys/kernel/random/uuid)" \
            --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            '.metadata.component.name = $n | .serialNumber = $u | .version = 1 | .metadata.timestamp = $ts' \
            target/bom.json > target/bom.tmp
          mv target/bom.tmp target/bom.json
          echo "serialNumber/version: $(jq -c '{serialNumber, version}' target/bom.json)"
          echo "Package SBOM metadata.timestamp: $(jq -r '.metadata.timestamp' target/bom.json)"
          echo "Root component: $(jq -c '.metadata.component | {type, name, version}' target/bom.json)"
          echo "Components in package SBOM: $(jq '.components | length' target/bom.json)"

      - name: Generate ConcertDef application SBOM
        working-directory: ${{ env.APP_DIR }}
        env:
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          # Concert keeps one name per repository URL, and this repo is already
          # registered under its repository name, so the code component must use it.
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          APP_VERSION=$(mvn -B -q -ntp -DforceStdout help:evaluate -Dexpression=project.version)
          NOW=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          # ConcertDef 2.0.0 application SBOM. It must list ALL components of the
          # application version; the code component purl must equal the repo_url
          # sent with the package SBOM so Concert can correlate them.
          jq -n \
            --arg name "${APP_NAME}" \
            --arg version "${APP_VERSION}" \
            --arg now "${NOW}" \
            --arg build "${GITHUB_RUN_NUMBER}" \
            --arg repo_url "${REPO_URL}" \
            --arg repo_name "${REPO_NAME}" \
            --arg branch "${BRANCH}" \
            '{
              bomFormat: "ConcertDef",
              specVersion: "2.0.0",
              metadata: {
                timestamp: $now,
                type: "application",
                "application-name": $name,
                "application-version": $version,
                description: "Credit reporting application",
                "build-number": $build,
                "build-timestamp": $now
              },
              components: [
                {
                  "bom-ref": ("component:" + $name),
                  type: "component",
                  name: $name,
                  components: [
                    {
                      "bom-ref": ("code:" + $repo_name),
                      type: "code",
                      name: $repo_name,
                      purl: $repo_url,
                      branch: $branch
                    }
                  ]
                }
              ]
            }' > target/concertdef-application-sbom.json

          echo "Application: ${APP_NAME} ${APP_VERSION}"

      # Concert does not match package SBOMs against advisories itself; CVE findings
      # come from an uploaded vulnerability scan. Concert's source code scan sample
      # (IBM/Concert use-case-data-files/*/vulnerabilities/code_scan/
      # code_scan_cyclonedx_sample.json) is a Trivy CycloneDX VDR, and the docs say
      # the file must match that structure and must not be edited. A Grype CycloneDX
      # file has a different structure (no metadata.component, no dependencies) and
      # was rejected with "Error processing", so the scan is done with Trivy.
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.3.1
        with:
          version: v0.76.1

      - name: Scan package SBOM for vulnerabilities (Trivy)
        working-directory: ${{ env.APP_DIR }}
        run: |
          # Exit code is 0 even when vulnerabilities are found: findings are reported
          # to Concert, they must not fail this job. The output is not modified.
          trivy sbom --scanners vuln --format cyclonedx \
            --output target/trivy-vulnerabilities.cdx.json target/bom.json
          test -s target/trivy-vulnerabilities.cdx.json
          echo "Package SBOM timestamp: $(jq -r '.metadata.timestamp' target/bom.json)"
          echo "Trivy scan timestamp (as generated): $(jq -r '.metadata.timestamp' target/trivy-vulnerabilities.cdx.json)"
          # Concert also ingests this file as a CycloneDX SBOM and fails it with
          # "a newer SBOM already exists for this entity" unless metadata.timestamp is
          # newer than the package SBOM's. Only that one value is refreshed (to the
          # current UTC time, after bom.json was written); the structure is untouched.
          jq --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '.metadata.timestamp = $ts' \
            target/trivy-vulnerabilities.cdx.json > target/trivy.tmp
          mv target/trivy.tmp target/trivy-vulnerabilities.cdx.json
          echo "Trivy scan timestamp (uploaded):     $(jq -r '.metadata.timestamp' target/trivy-vulnerabilities.cdx.json)"
          echo "Top-level keys: $(jq -c 'keys' target/trivy-vulnerabilities.cdx.json)"
          echo "Vulnerabilities found: $(jq '(.vulnerabilities // []) | length' target/trivy-vulnerabilities.cdx.json)"
          jq -r '(.vulnerabilities // [])[] | "\(.id) \(.affects[0].ref // "")"' target/trivy-vulnerabilities.cdx.json | head -n 20

      - name: Upload SBOMs to Concert
        working-directory: ${{ env.APP_DIR }}
        env:
          # Secret value includes the key type, e.g. "C_API_KEY <key>".
          # For OpenShift deployments use "ZenApiKey <key>".
          CONCERT_API_KEY: ${{ secrets.CONCERT_API_KEY }}
          INSTANCE_ID: ${{ secrets.CONCERT_INSTANCE_ID || vars.CONCERT_INSTANCE_ID || '0000-0000-0000-0000' }}
          CONCERT_URL: ${{ vars.CONCERT_HOSTNAME || secrets.CONCERT_HOSTNAME }}
          # API path prefix. bob-shell-v2.yml uses <CONCERT_HOSTNAME>/concert/ingestion/...
          # Set the variable CONCERT_API_PREFIX to override (use a single space-free
          # value such as "/concert", or "none" for no prefix).
          API_PREFIX: ${{ vars.CONCERT_API_PREFIX || '/concert' }}
          # Skips TLS verification (curl -k) because the Concert instance uses a
          # self-signed certificate, same as trigger-concert-ingestion.yml.
          # Set the repository variable CONCERT_INSECURE_TLS=false to enforce verification.
          INSECURE_TLS: ${{ vars.CONCERT_INSECURE_TLS || 'true' }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          : "${CONCERT_API_KEY:?Secret CONCERT_API_KEY is not set}"

          # Strip stray whitespace / CR / newline pasted with the secret.
          CONCERT_API_KEY=$(printf '%s' "${CONCERT_API_KEY}" | tr -d '\r\n' | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          case "${CONCERT_API_KEY}" in
            "C_API_KEY "*|"ZenApiKey "*) ;;
            *) echo "::warning::CONCERT_API_KEY should start with 'C_API_KEY ' (or 'ZenApiKey ' on OpenShift) followed by the key." ;;
          esac
          : "${CONCERT_URL:?CONCERT_HOSTNAME is not set. Add it under Settings > Secrets and variables > Actions > Variables (e.g. https://<host>:12443)}"

          [ "${API_PREFIX}" = "none" ] && API_PREFIX=""
          UPLOAD_URL="${CONCERT_URL%/}${API_PREFIX}/ingestion/api/v1/upload_files"

          CURL_TLS=()
          if [ "${INSECURE_TLS:-}" = "true" ]; then
            CURL_TLS=(-k)
          fi

          upload() {
            local data_type="$1" file="$2" metadata="${3:-}"
            local args=(
              --silent --show-error "${CURL_TLS[@]}"
              --request POST
              --url "${UPLOAD_URL}"
              --header "accept: application/json"
              --header "InstanceId: ${INSTANCE_ID}"
              --header "Authorization: ${CONCERT_API_KEY}"
              --form "data_type=${data_type}"
              --form "filename=@${file}"
              --output response.json
              --write-out "%{http_code}"
            )
            if [ -n "${metadata}" ]; then
              args+=(--form "metadata=${metadata}")
            fi

            echo "Uploading ${file} as ${data_type}..."
            local status
            status=$(curl "${args[@]}")
            echo "HTTP ${status}: $(cat response.json)"
            if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
              echo "::error::Concert upload of ${file} (${data_type}) failed with HTTP ${status}"
              return 1
            fi
          }

          # 1. Define / update the application (ConcertDef SBOMs use data_type=application_sbom).
          upload application_sbom target/concertdef-application-sbom.json

          # 2. Upload the CycloneDX package SBOM. Documented metadata for a source
          # package SBOM: repo_url and repo_name (required), branch_name (optional).
          # application_name / application_version are not listed for package SBOMs
          # in the docs, but Concert's error "Multiple applications reference the
          # same source repository ... Specify the application name and version
          # explicitly in the request" asks for them, so they are sent as well.
          APP_VERSION=$(jq -r '.metadata."application-version"' target/concertdef-application-sbom.json)
          METADATA=$(jq -nc \
            --arg repo_url "${REPO_URL}" \
            --arg repo_name "${GITHUB_REPOSITORY#*/}" \
            --arg branch "${BRANCH}" \
            --arg app_name "${APP_NAME}" \
            --arg app_version "${APP_VERSION}" \
            '{repo_url: $repo_url, repo_name: $repo_name, branch_name: $branch,
              application_name: $app_name, application_version: $app_version}')
          echo "Package SBOM metadata: ${METADATA}"
          upload package_sbom target/bom.json "${METADATA}"

          # 3. Upload the vulnerability scan (CVE findings) after the repository is
          # linked to the application. code_scan requires repo_url.
          SCAN_METADATA=$(jq -nc \
            --arg repo_url "${REPO_URL}" \
            --arg branch "${BRANCH}" \
            --arg app_name "${APP_NAME}" \
            --arg app_version "${APP_VERSION}" \
            '{scanner_name: "trivy", repo_url: $repo_url, branch_name: $branch,
              application_name: $app_name, application_version: $app_version}')
          echo "Vulnerability scan metadata: ${SCAN_METADATA}"
          upload code_scan target/trivy-vulnerabilities.cdx.json "${SCAN_METADATA}"

      - name: Keep SBOMs as build artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: credit-app-sboms
          path: |
            ${{ env.APP_DIR }}/target/bom.json
            ${{ env.APP_DIR }}/target/concertdef-application-sbom.json
            ${{ env.APP_DIR }}/target/trivy-vulnerabilities.cdx.json
          if-no-files-found: warn

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Concert SBOM upload"
            echo ""
            echo "- **Application**: ${APP_NAME}"
            echo "- **Commit**: ${{ github.sha }}"
            echo "- **Branch**: ${{ github.ref_name }}"
            echo "- **Result**: ${{ job.status }}"
          } >> "$GITHUB_STEP_SUMMARY"
